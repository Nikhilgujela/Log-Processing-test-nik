version: "3.8"

services:
  backend:
    image: nikhilgujela/log-processing-backend:latest
    container_name: log-processing-backend
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/logdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: examplepassword
    depends_on:
      - db
    restart: always

  frontend:
    image: nikhilgujela/log-processing-frontend:latest
    container_name: log-processing-frontend
    ports:
      - "3001:80"
    restart: always

  db:
    image: postgres:15-alpine
    container_name: log-processing-postgres
    environment:
      POSTGRES_DB: logdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: examplepassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
